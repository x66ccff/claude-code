name: Public safety audit

on:
  push:
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install audit dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep
      - name: Reject credentials and private runtime files
        run: scripts/audit-public-tree.sh .
